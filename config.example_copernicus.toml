[causality]
local_path = ""
http_url = ""

[quantum]
iqm_token = ""
iqm_server = "https://resonance.iqm.tech"
iqm_backend = ""
tunneling_qubits = 4
tunneling_time = 3.0
tunneling_trotter_steps = 3
herding_qubits = 4
herding_layers = 1
herding_shots = 4000

# Event gating: when enabled, IQM hardware is only used when KAIROS
# flags an anomaly or Causalitybot detects a horizon above threshold.
# Baseline ticks run on Aer/classical with zero credit burn.
gate_enabled = true
gate_on_kairos = true
gate_on_causality = true
gate_kairos_threshold = 0.05
gate_causality_threshold = 0.20

[stirpes]
enabled = false
chain_type = "mock"
tezos_rpc_url = ""
tezos_contract_address = ""
tezos_private_key_env = "STIRPES_PRIVATE_KEY"
cipher_seed = "stirpes-default-seed"
tree_method = "neighbor_joining"
flush_threshold = 100
session_id = "default-session"

[llm]
