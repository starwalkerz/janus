# JANUS configuration example.

[strategy]
# "conservative" | "aggressive" | "opportunity"
name = "opportunity"

[agop]
mode = "legacy"
local_path = "."
http_url = ""

[kairos]
local_path = ""
http_url = ""
quantum = false

[causality]
local_path = ""
http_url = ""

[quantum]
iqm_token = ""
iqm_server = "https://resonance.iqm.tech"
iqm_backend = ""
tunneling_qubits = 4
tunneling_time = 3.0
tunneling_trotter_steps = 3
herding_qubits = 4
herding_layers = 1
herding_shots = 4000

[llm]
base_url = "http://localhost:11434/v1"
model = "qwen2.5:7b-instruct"
api_key = "ollama"
temperature = 0.0
timeout_s = 30.0

[skills]
directory = "skills"
active = [
  "toxic-flow-gate",
  "regime-classifier",
  "sizing-discipline",
  "econophysics-analyst",
  "opportunity-analyst",
]

[risk]
equity = 100000.0
seed = 42

[modules]
imports = []

# Dampening modules — disabled in the OPPORTUNITY strategy so the
# opportunity modules are the sole interpretation of these signals.

[modules.kairos]
enabled = false
on_error = "fail_open"

[modules.causality]
enabled = false
on_error = "fail_open"

[modules.regime]
enabled = true

[modules.sentiment]
enabled = false

[modules.econophysics_tunneling]
enabled = true
on_error = "fail_open"

[modules.econophysics_herding]
enabled = true
on_error = "fail_open"

# Opportunity modules — risk-on interpretation.

[modules.agop_opportunity]
enabled = true
on_error = "fail_open"

[modules.causality_opportunity]
enabled = true
on_error = "fail_open"

[modules.kairos_opportunity]
enabled = true
on_error = "fail_open"

[modules.opportunity_synthesizer]
enabled = true
on_error = "fail_open"